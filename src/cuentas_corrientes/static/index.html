<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente de cuentas corrientes</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18221c; background: #f4f7f5; }
    body { max-width: 980px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 4px; } .hint { color: #5c6b61; margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 18px; }
    .card { background: white; border: 1px solid #dce5df; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px #1738230b; }
    label { display: block; font-weight: 650; margin: 12px 0 5px; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; font: inherit; border-radius: 9px; }
    input, select, textarea { border: 1px solid #bac8bf; padding: 10px; } textarea { min-height: 150px; resize: vertical; }
    button { margin-top: 12px; padding: 11px; border: 0; background: #176b3a; color: white; font-weight: 700; cursor: pointer; }
    button.secondary { background: #e9f1ec; color: #174c2d; }
    button.danger { background: #fff0ee; color: #9b2d20; border: 1px solid #e8b8b1; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .balance { font-size: 1.35rem; font-weight: 750; } .warning { color: #955500; }
    .movement { border-top: 1px solid #e2e8e4; padding: 10px 0; } .movement small { color: #66736b; }
    #message { white-space: pre-wrap; padding-top: 10px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Agente de cuentas corrientes</h1>
  <p class="hint">Cargá información, revisá lo interpretado y aprobá solo cuando sea correcto.</p>
  <div class="grid">
    <section class="card">
      <h2>1. Elegir cuenta</h2>
      <select id="accounts"></select>
      <label>Empresa</label><input id="company" placeholder="Ej.: Empresa Fields SRL">
      <label>Cliente, proveedor o contraparte</label><input id="counterparty" placeholder="Ej.: Transporte de prueba">
      <button class="secondary" onclick="createAccount()">Crear cuenta nueva</button>
      <h2>2. Pegar información</h2>
      <textarea id="text" placeholder="Ejemplo ficticio: El 20/07/2026 le transferimos $ 700.000 como anticipo general"></textarea>
      <label>Referencia de origen</label><input id="reference" placeholder="Ej.: conversación ficticia 20-07">
      <button onclick="processText()">Analizar</button>
      <div id="message"></div>
    </section>
    <section class="card">
      <h2>Resumen</h2>
      <label>Moneda</label><select id="currency" onchange="refresh()"><option>ARS</option><option>USD</option></select>
      <div id="balance" class="balance">Elegí una cuenta</div>
      <div id="pending" class="warning"></div>
      <h2>Movimientos</h2>
      <div id="movements"></div>
    </section>
  </div>
<script>
const accounts = document.querySelector('#accounts');
accounts.onchange = refresh;
async function request(url, options={}) {
  const response = await fetch(url, {headers:{'Content-Type':'application/json'}, ...options});
  if (!response.ok) throw new Error((await response.json()).detail || 'No se pudo completar la operación');
  return response.json();
}
async function loadAccounts(selected) {
  const rows = await request('/accounts');
  accounts.innerHTML = '<option value="">Elegir…</option>' + rows.map(a => `<option value="${a.id}">${a.counterparty} — ${a.company}</option>`).join('');
  if (selected) accounts.value = selected;
  await refresh();
}
async function createAccount() {
  const company = document.querySelector('#company').value.trim();
  const counterparty = document.querySelector('#counterparty').value.trim();
  if (!company || !counterparty) return show('Completá empresa y contraparte.');
  const created = await request('/accounts', {method:'POST', body:JSON.stringify({company, counterparty})});
  show('Cuenta creada.'); await loadAccounts(created.id);
}
async function processText() {
  if (!accounts.value) return show('Primero elegí o creá una cuenta.');
  const text = document.querySelector('#text').value.trim();
  const source_reference = document.querySelector('#reference').value.trim();
  if (!text || !source_reference) return show('Pegá un texto y agregá una referencia de origen.');
  const result = await request(`/accounts/${accounts.value}/intake/text`, {method:'POST', body:JSON.stringify({text, source_reference})});
  show(result.created ? 'Movimiento detectado. Revisalo antes de aprobar.' : result.questions.join('\n'));
  await refresh();
}
async function approve(id) {
  await request(`/accounts/${accounts.value}/movements/${id}/approve`, {method:'POST'});
  show('Movimiento aprobado y saldo actualizado.'); await refresh();
}
async function discard(id) {
  const reason = window.prompt('¿Por qué querés denegar este movimiento?', 'No corresponde');
  if (!reason || !reason.trim()) return;
  await request(`/accounts/${accounts.value}/movements/${id}/discard`, {method:'POST', body:JSON.stringify({reason})});
  show('Movimiento denegado. Quedó guardado como descartado y no afecta los saldos.'); await refresh();
}
async function refresh() {
  if (!accounts.value) { document.querySelector('#balance').textContent='Elegí una cuenta'; document.querySelector('#movements').innerHTML=''; return; }
  const currency = document.querySelector('#currency').value;
  const [balance, movements] = await Promise.all([request(`/accounts/${accounts.value}/balance/${currency}`), request(`/accounts/${accounts.value}/movements`)]);
  document.querySelector('#balance').textContent = `${balance.confirmed_label}: ${balance.confirmed_amount} ${currency}`;
  document.querySelector('#pending').textContent = balance.pending_count ? `Proyectado: ${balance.projected_amount} ${currency} · ${balance.pending_count} pendiente(s)` : 'Sin movimientos pendientes';
  document.querySelector('#movements').innerHTML = movements.filter(m => m.currency===currency).map(m => `<div class="movement"><b>${m.operation_date} · ${m.amount} ${m.currency}</b><br>${m.description}<br><small>${m.status==='review'?'Pendiente de aprobación':m.status==='confirmed'?'Confirmado':'Descartado'}</small>${m.status==='review'?`<div class="actions"><button class="secondary" onclick="approve('${m.id}')">Aprobar</button><button class="danger" onclick="discard('${m.id}')">Denegar</button></div>`:''}</div>`).join('') || 'Sin movimientos.';
}
function show(text) { document.querySelector('#message').textContent=text; }
loadAccounts();
</script>
</body>
</html>
